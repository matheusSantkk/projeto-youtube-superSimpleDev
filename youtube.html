<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/global.css" />
    <link rel="stylesheet" href="styles/header.css" />
    <title>Youtube.com Clone</title>
  </head>
  <body>
    <div class="header">
      <div class="left-side">
        <img src="img/icons/hamburger-menu.svg" class="hamburger-icon" />
        <img src="img/icons/youtube-logo.svg" class="youtube-logo" />
      </div>

      <div class="center-side">
        <input type="text" placeholder="Search" class="search-input" />
        <button class="search-button">
          <img src="img/icons/search.svg" class="search-icon" />
        </button>
        <button class="voice-search-button">
          <img
            src="img/icons/voice-search-icon.svg"
            class="voice-search-icon"
          />
        </button>
      </div>

      <div class="right-side">
        <button class="upload-button">
          <img src="img/icons/upload.svg" class="upload-icon" />
        </button>
        <button class="youtube-apps-button">
          <img src="img/icons/youtube-apps.svg" class="youtube-apps-icon" />
        </button>
        <button class="notifications-button">
          <img src="img/icons/notifications.svg" class="notifications-icon" />
        </button>
        <div class="my-channel">
          <img
            src="img/channels/my-channel.jpeg"
            class="my-channel-picture"
          />
        </div>
      </div>
    </div>
  </body>
</html>
